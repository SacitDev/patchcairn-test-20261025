name: fixture-safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-fixtures:
    name: Portable fixtures (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12', '3.15']
        include:
          - os: windows-latest
            timeout: 90
          - os: ubuntu-latest
            timeout: 15
          - os: macos-latest
            timeout: 15
    runs-on: ${{ matrix.os }}
    # Windows Python helpers reuse an owned serial worker; native checks stay per operation.
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-10-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, reviewed 2026-10-23
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, reviewed 2026-10-23
        with:
          node-version: '24'
          check-latest: false
      - name: All standard-library fictional unit and integration tests with the skip audit
        # Site tests also exercise the local visual script with Node's offline VM.
        # No fail-fast: every test runs, and a skip without a valid "only on <platforms>:" tag fails the job.
        run: python -I -S -B tests/run_tests.py --report work/test-results/report.json
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, reviewed 2026-10-25
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: work/test-results/report.json
          if-no-files-found: error
      - name: Offline report visibility and injection fixtures
        if: ${{ !cancelled() }}
        run: node tests/test_report_ui.cjs

  windows-fixtures:
    name: Windows PowerShell fixtures
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell 7 - tests/Invoke-FixtureTests.ps1
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          $PSVersionTable | ConvertTo-Json
          & ./tests/Invoke-FixtureTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 - tests/Test-WindowsScoped.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          & ./tests/Test-WindowsScoped.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 - tests/Test-PrivateWorkspace.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          & ./tests/Test-PrivateWorkspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 - tests/Invoke-FixtureTests.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          $legacy = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $legacy -NoProfile -NonInteractive -Command '$env:TZ="UTC"; $ErrorActionPreference="Stop"; $PSVersionTable | ConvertTo-Json; & ./tests/Invoke-FixtureTests.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 - tests/Test-WindowsScoped.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          $legacy = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $legacy -NoProfile -NonInteractive -File ./tests/Test-WindowsScoped.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 - tests/Test-PrivateWorkspace.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TZ='UTC'
          $ErrorActionPreference='Stop'
          $legacy = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $legacy -NoProfile -NonInteractive -File ./tests/Test-PrivateWorkspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
